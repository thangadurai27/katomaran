<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="SnapLink AI banner — Shorten Smarter. Track Everything. Grow Faster.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1140"/>
      <stop offset="55%" stop-color="#3B1E7E"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- soft glow shapes -->
  <circle cx="1030" cy="40" r="140" fill="#8B5CF6" opacity="0.18"/>
  <circle cx="90" cy="290" r="120" fill="#A78BFA" opacity="0.12"/>
  <circle cx="480" cy="20" r="70" fill="#C4B5FD" opacity="0.08"/>

  <!-- logo lockup -->
  <g transform="translate(64,52)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#8B5CF6"/>
    <path d="M31 10 L18 30 h11 l-2 16 13-20 h-11 l3-16 z" fill="#FFFFFF"/>
    <text x="72" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">SnapLink</text>
    <text x="72" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#C4B5FD" dx="132">AI</text>
    <text x="0" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="url(#accent)" letter-spacing="3">SHORTEN SMARTER. TRACK EVERYTHING. GROW FASTER.</text>
    <text x="0" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#D8CCF5" opacity="0.85">Full-stack URL shortener with real-time analytics, QR codes, campaigns</text>
    <text x="0" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#D8CCF5" opacity="0.85">and Google Gemini intelligence — built on React, Node.js and MongoDB.</text>
  </g>

  <!-- right motif cards -->
  <g transform="translate(820,58)">
    <!-- link card -->
    <g transform="translate(0,0)">
      <rect width="150" height="88" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.35"/>
      <rect x="16" y="20" width="118" height="12" rx="6" fill="#C4B5FD" opacity="0.9"/>
      <path d="M28 54 h30 a10 10 0 0 1 0 20 h-6" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M50 64 h60 a10 10 0 0 0 0 -20 h-6" stroke="#C4B5FD" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(28,10)"/>
      <text x="16" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#E4DBFA">snaplink.ai/r/8xK2pQ</text>
    </g>
    <!-- analytics card -->
    <g transform="translate(0,110)">
      <rect width="150" height="88" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.35"/>
      <rect x="18" y="58" width="14" height="16" rx="3" fill="#8B5CF6"/>
      <rect x="40" y="44" width="14" height="30" rx="3" fill="#A78BFA"/>
      <rect x="62" y="30" width="14" height="44" rx="3" fill="#C4B5FD"/>
      <rect x="84" y="20" width="14" height="54" rx="3" fill="#E4DBFA"/>
      <path d="M20 40 C 45 26, 70 30, 100 14" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- QR card -->
    <g transform="translate(170,55)">
      <rect width="110" height="143" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.35"/>
      <!-- QR pattern -->
      <g fill="#FFFFFF">
        <rect x="20" y="20" width="26" height="26" rx="4"/><rect x="64" y="20" width="26" height="26" rx="4"/>
        <rect x="20" y="64" width="26" height="26" rx="4"/>
        <rect x="26" y="26" width="14" height="14" fill="#4C1D95"/><rect x="70" y="26" width="14" height="14" fill="#4C1D95"/><rect x="26" y="70" width="14" height="14" fill="#4C1D95"/>
        <rect x="56" y="56" width="10" height="10" rx="2"/><rect x="72" y="68" width="10" height="10" rx="2"/><rect x="58" y="84" width="10" height="10" rx="2"/>
        <rect x="24" y="102" width="10" height="10" rx="2"/><rect x="42" y="108" width="10" height="10" rx="2"/><rect x="62" y="102" width="10" height="10" rx="2"/><rect x="80" y="112" width="10" height="10" rx="2"/>
      </g>
      <!-- AI spark -->
      <circle cx="88" cy="30" r="14" fill="#8B5CF6"/>
      <path d="M92 24 l-6 9 h5 l-1 7 6-9 h-5 l1-7 z" fill="#FFFFFF" transform="scale(0.9) translate(9,3)"/>
    </g>
  </g>

  <text x="64" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#B9A8E8" opacity="0.8">React · Node.js · Express · MongoDB · Gemini AI · Vercel · Render</text>
</svg>
